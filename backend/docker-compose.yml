services:
  # Redis for data persistence
  redis:
    image: redis:7-alpine
    container_name: bones-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redpanda (Kafka-compatible) for event streaming
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.9
    container_name: bones-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --smp 1
      - --memory 1G
      - --mode dev-container
      - --default-log-level=info
    ports:
      - "18081:18081" # Schema Registry
      - "18082:18082" # Pandaproxy
      - "19092:19092" # Kafka (external)
      - "9644:9644"   # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  # Redpanda Console for monitoring and debugging
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.1
    container_name: bones-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: true
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
    volumes:
      - ./redpanda-console-config.yml:/tmp/config.yml:ro
    restart: unless-stopped

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: bones-api
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8080
      - REDIS_URL=redis://redis:6379
      - REDPANDA_BROKERS=redpanda:9092
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./packages/api:/app/packages/api
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/packages/api/node_modules
      - /app/packages/shared/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Orchestrator Service
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: bones-orchestrator
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=redis://redis:6379
      - REDPANDA_BROKERS=redpanda:9092
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./packages/orchestrator:/app/packages/orchestrator
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/packages/orchestrator/node_modules
      - /app/packages/shared/node_modules
    restart: unless-stopped

  # RentCast Fetcher Worker
  rentcast-fetcher:
    build:
      context: .
      dockerfile: Dockerfile.rentcast-fetcher
    container_name: bones-rentcast-fetcher
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=redis://redis:6379
      - REDPANDA_BROKERS=redpanda:9092
      - RENTCAST_API_KEY=${RENTCAST_API_KEY}
      - RENTCAST_BASE_URL=${RENTCAST_BASE_URL:-https://api.rentcast.io}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./packages/rentcast-fetcher:/app/packages/rentcast-fetcher
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/packages/rentcast-fetcher/node_modules
      - /app/packages/shared/node_modules
    restart: unless-stopped

  photo-analyst:
    build:
      context: .
      dockerfile: Dockerfile.photo-analyst
    container_name: bones-photo-analyst
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - REDIS_URL=redis://redis:6379
      - REDPANDA_BROKERS=redpanda:9092
      # Without a key the service falls back to the mock provider, so the
      # stack still runs end to end with no credentials.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - VISION_PROVIDER=${VISION_PROVIDER:-}
      - VISION_MODEL=${VISION_MODEL:-claude-opus-5}
      - VISION_EFFORT=${VISION_EFFORT:-high}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./packages/photo-analyst:/app/packages/photo-analyst
      - ./packages/shared:/app/packages/shared
      - /app/node_modules
      - /app/packages/photo-analyst/node_modules
      - /app/packages/shared/node_modules
    restart: unless-stopped

volumes:
  redis_data:
  redpanda_data:

networks:
  default:
    name: bones-network